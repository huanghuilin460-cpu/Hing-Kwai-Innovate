<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>像素风洞沙盒 · Pixel Wind Tunnel</title>
  <style>
    :root {
      --ink: #1b1f2a;
      --panel: #2b3142;
      --panel-2: #343b4f;
      --line: #454d66;
      --paper: #dfe3ea;
      --paper-grid: #c9cfdb;
      --accent: #5ad1d6;
      --accent-2: #f2a65a;
      --danger: #e8637a;
      --text: #eef1f7;
      --text-dim: #a9b0c3;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--ink);
      font-family: 'Courier New', ui-monospace, monospace;
      color: var(--text);
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
    #toolbar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px;
      background: var(--panel);
      border-bottom: 4px solid var(--line);
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
      flex-wrap: wrap;
      position: relative; z-index: 5;
      image-rendering: pixelated;
    }
    #toolbar .title {
      font-weight: bold; letter-spacing: 1px; font-size: 13px;
      color: var(--accent); padding-right: 8px; white-space: nowrap;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
    }
    .sep { width: 2px; align-self: stretch; background: var(--line); margin: 0 4px; }
    button.tool {
      -webkit-appearance: none; appearance: none;
      border: none; cursor: pointer;
      width: 44px; height: 44px;
      background: var(--panel-2);
      border: 2px solid var(--line);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35), inset 2px 2px 0 rgba(255,255,255,0.06);
      image-rendering: pixelated;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      padding: 0;
    }
    button.tool canvas { image-rendering: pixelated; width: 24px; height: 24px; pointer-events: none; }
    button.tool:active { transform: translateY(1px); }
    button.tool.active {
      background: var(--accent);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3), inset 2px 2px 0 rgba(255,255,255,0.35);
    }
    button.tool .lbl {
      position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: var(--text-dim); white-space: nowrap;
    }
    .tool-group { display: flex; gap: 6px; padding-bottom: 14px; }
    .ctrl {
      display: flex; flex-direction: column; align-items: flex-start;
      font-size: 10px; color: var(--text-dim); gap: 2px;
      padding-bottom: 14px;
    }
    .ctrl input[type=range] { width: 90px; accent-color: var(--accent-2); }
    .ctrl .val { color: var(--accent); font-weight: bold; }
    .chk { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); padding-bottom: 14px; }
    #playPause {
      -webkit-appearance: none; appearance: none;
      width: 44px; height: 44px; background: var(--panel-2); border: 2px solid var(--line);
      color: var(--text); cursor: pointer; font-size: 16px;
      box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35), inset 2px 2px 0 rgba(255,255,255,0.06);
      padding: 0;
    }
    #clearBtn {
      -webkit-appearance: none; appearance: none;
      height: 44px; padding: 0 10px; background: var(--danger); border: 2px solid #a83b4d;
      color: #fff; font-weight: bold; cursor: pointer; font-size: 11px;
    }
    #status {
      margin-left: auto; font-size: 10px; color: var(--text-dim); text-align: right; line-height: 1.5;
      padding-right: 4px;
    }
    #status b { color: var(--accent-2); }
    #stage { position: relative; flex: 1 1 auto; overflow: hidden; background: var(--paper); }
    #stage canvas {
      position: absolute; top: 0; left: 0;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    #topHint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: 11px;
      color: #4a5066;
      background: rgba(255,255,255,0.75);
      padding: 6px 14px;
      border: 1px solid rgba(0,0,0,0.15);
      line-height: 1.5;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
    #hint {
      position: absolute; left: 10px; bottom: 10px; z-index: 4;
      font-size: 10px; color: #4a5066; background: rgba(255,255,255,0.55);
      padding: 6px 8px; border: 1px solid rgba(0,0,0,0.15); max-width: 260px; line-height: 1.5;
      pointer-events: none;
    }
    #errorLog {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(255,0,0,0.8); color: white; padding: 8px; font-size: 12px;
      display: none; max-width: 300px; word-wrap: break-word;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="title">▓ 像素风洞 WIND&nbsp;TUNNEL</div>
    <div class="sep"></div>
    <div class="tool-group">
      <button class="tool" data-tool="select" title="选择/移动/旋转">
        <canvas width="16" height="16" data-icon="select"></canvas>
        <span class="lbl">选择</span>
      </button>
      <button class="tool" data-tool="wall" title="放置矩形墙体：拖拽画出大小">
        <canvas width="16" height="16" data-icon="wall"></canvas>
        <span class="lbl">矩形墙</span>
      </button>
      <button class="tool" data-tool="wall-tri" title="放置三角形墙体：拖拽画出大小">
        <canvas width="16" height="16" data-icon="wall-tri"></canvas>
        <span class="lbl">三角墙</span>
      </button>
      <button class="tool" data-tool="wall-circle" title="放置圆形墙体：拖拽画出大小">
        <canvas width="16" height="16" data-icon="wall-circle"></canvas>
        <span class="lbl">圆形墙</span>
      </button>
      <button class="tool" data-tool="blower" title="放置鼓风机：点击放置，双击旋转朝向">
        <canvas width="16" height="16" data-icon="blower"></canvas>
        <span class="lbl">鼓风机</span>
      </button>
      <button class="tool" data-tool="delete" title="删除：点击物体删除">
        <canvas width="16" height="16" data-icon="delete"></canvas>
        <span class="lbl">删除</span>
      </button>
    </div>
    <div class="sep"></div>
    <button id="clearBtn" title="清空画布">清空 CLEAR</button>
    <button id="playPause" title="暂停/继续模拟">⏸</button>
    <div class="sep"></div>
    <div class="ctrl">
      <span>风力 FORCE <span class="val" id="forceVal">6.0</span></span>
      <input type="range" id="forceSlider" min="1" max="15" step="0.5" value="6">
    </div>
    <div class="ctrl">
      <span>扩散 DIFFUSION <span class="val" id="diffVal">0.0002</span></span>
      <input type="range" id="diffSlider" min="0" max="20" step="1" value="2">
    </div>
    <div class="ctrl">
      <span>粘度 VISCOSITY <span class="val" id="viscVal">0.0000</span></span>
      <input type="range" id="viscSlider" min="0" max="20" step="1" value="0">
    </div>
    <div class="chk">
      <label><input type="checkbox" id="streamToggle"> 流线粒子<br>STREAMLINES</label>
    </div>
    <div id="status">工具: <b id="toolName">选择</b> · 物体: <b id="objCount">0</b> · FPS: <b id="fpsVal">0</b></div>
  </div>
  <div id="stage">
    <canvas id="fluidCanvas"></canvas>
    <canvas id="mainCanvas"></canvas>
    <div id="topHint">双击物体旋转方向 · 拖拽右下角缩放 · 长按/右键删除</div>
    <div id="hint">拖拽放置墙体和鼓风机，位置完全自由（非网格吸附）。选中物体后拖右下角蓝色小方块可缩放大小；双击物体可切换朝向。右键/长按物体可删除。</div>
    <div id="errorLog"></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  // 捕获运行时错误
  window.onerror = function(msg, url, line, col, error) {
    const log = document.getElementById('errorLog');
    if (log) {
      log.style.display = 'block';
      log.textContent = '脚本错误: ' + msg + ' (行 ' + line + ')';
    }
    return false;
  };

  const stage = document.getElementById('stage');
  const fluidCanvas = document.getElementById('fluidCanvas');
  const mainCanvas = document.getElementById('mainCanvas');
  const fctx = fluidCanvas.getContext('2d');
  const mctx = mainCanvas.getContext('2d', { alpha: false });

  // 离屏画布：缓存网格背景
  const gridCache = document.createElement('canvas');
  const gridCtx = gridCache.getContext('2d');

  // 像素砖块图案缓存
  let brickPattern = null;

  // 关闭抗锯齿 + 兼容旧版 WebKit
  function disableSmoothing(ctx) {
    ctx.imageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;
  }
  disableSmoothing(mctx);
  disableSmoothing(fctx);
  disableSmoothing(gridCtx);

  let W = 0, H = 0;
  const SIM_N = 240;
  let SIM_M = 160;
  let paused = false;
  let currentTool = 'select';
  let objects = [];
  let nextId = 1;
  let selectedId = null;
  let drag = null;
  let pointerDownInfo = null;
  let longPressTimer = null;
  let showStreamlines = false;

  // FPS 统计
  let fps = 0;
  let fpsFrames = 0;
  let fpsLastTime = performance.now();
  const fpsValLabel = document.getElementById('fpsVal');

  // 双击判定
  let lastTapTime = 0;
  let lastTapId = null;
  const DOUBLE_TAP_DELAY = 300;

  let params = {
    force: 6.0,
    diff: 0.0002,
    visc: 0.0
  };

  /* 流体求解器 */
  let N = SIM_N, M = SIM_M;
  let size = (N+2)*(M+2);
  let u, v, u0, v0, dens, dens0, curlField, obstacle;

  function IX(i,j) { return i + (N+2)*j; }

  function allocateFields() {
    N = SIM_N; M = SIM_M;
    size = (N+2)*(M+2);
    u = new Float32Array(size); v = new Float32Array(size);
    u0 = new Float32Array(size); v0 = new Float32Array(size);
    dens = new Float32Array(size); dens0 = new Float32Array(size);
    curlField = new Float32Array(size);
    obstacle = new Uint8Array(size);
  }
  allocateFields();

  function clampi(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  function set_bnd(b, x) {
    for (let i = 1; i <= N; i++) {
      x[IX(i, 0)]   = x[IX(i, 1)];
      x[IX(i, M+1)] = x[IX(i, M)];
    }
    for (let j = 1; j <= M; j++) {
      x[IX(0, j)]   = x[IX(1, j)];
      x[IX(N+1, j)] = x[IX(N, j)];
    }
    x[IX(0, 0)]       = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, M+1)]     = 0.5 * (x[IX(1, M+1)] + x[IX(0, M)]);
    x[IX(N+1, 0)]     = 0.5 * (x[IX(N, 0)] + x[IX(N+1, 1)]);
    x[IX(N+1, M+1)]   = 0.5 * (x[IX(N, M+1)] + x[IX(N+1, M)]);

    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) x[IX(i, j)] = 0;
      }
    }
  }

  /* 障碍物边界反弹 + 溅射扰动 */
  function obstacleBounceSplash() {
    const bounce = 0.42;
    const perturb = 0.18;
    const forceBase = params.force * 0.15;

    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        if (!obstacle[IX(i, j)]) continue;

        if (j > 1 && !obstacle[IX(i, j-1)]) {
          const idx = IX(i, j-1);
          if (v[idx] > 0) v[idx] = -bounce * v[idx];
          u[idx] += (Math.random() - 0.5) * perturb * forceBase;
        }
        if (j < M && !obstacle[IX(i, j+1)]) {
          const idx = IX(i, j+1);
          if (v[idx] < 0) v[idx] = -bounce * v[idx];
          u[idx] += (Math.random() - 0.5) * perturb * forceBase;
        }
        if (i > 1 && !obstacle[IX(i-1, j)]) {
          const idx = IX(i-1, j);
          if (u[idx] > 0) u[idx] = -bounce * u[idx];
          v[idx] += (Math.random() - 0.5) * perturb * forceBase;
        }
        if (i < N && !obstacle[IX(i+1, j)]) {
          const idx = IX(i+1, j);
          if (u[idx] < 0) u[idx] = -bounce * u[idx];
          v[idx] += (Math.random() - 0.5) * perturb * forceBase;
        }
      }
    }
  }

  function lin_solve(b, x, x0, a, c, iters) {
    const invC = 1 / c;
    for (let k = 0; k < iters; k++) {
      for (let j = 1; j <= M; j++) {
        for (let i = 1; i <= N; i++) {
          if (obstacle[IX(i, j)]) { x[IX(i, j)] = 0; continue; }
          x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i-1, j)] + x[IX(i+1, j)] + x[IX(i, j-1)] + x[IX(i, j+1)])) * invC;
        }
      }
      set_bnd(b, x);
    }
  }

  function diffuse(b, x, x0, diffRate, dt, iters) {
    const a = dt * diffRate * N * M;
    lin_solve(b, x, x0, a, 1 + 4*a, iters);
  }

  function advect(b, d, d0, velU, velV, dt) {
    const dt0N = dt * N, dt0M = dt * M;
    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) { d[IX(i, j)] = 0; continue; }
        let x = i - dt0N * velU[IX(i, j)];
        let y = j - dt0M * velV[IX(i, j)];
        x = clampi(x, 0.5, N+0.5);
        y = clampi(y, 0.5, M+0.5);
        const i0 = Math.floor(x), i1 = i0 + 1;
        const j0 = Math.floor(y), j1 = j0 + 1;
        const s1 = x - i0, s0 = 1 - s1;
        const t1 = y - j0, t0 = 1 - t1;
        d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                       s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    set_bnd(b, d);
  }

  function project(velU, velV, p, div, iters) {
    const h = 1.0 / ((N + M) * 0.5);
    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) { div[IX(i, j)] = 0; p[IX(i, j)] = 0; continue; }
        div[IX(i, j)] = -0.5 * h * (velU[IX(i+1, j)] - velU[IX(i-1, j)] + velV[IX(i, j+1)] - velV[IX(i, j-1)]);
        p[IX(i, j)] = 0;
      }
    }
    set_bnd(0, div); set_bnd(0, p);
    lin_solve(0, p, div, 1, 4, iters);
    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) continue;
        velU[IX(i, j)] -= 0.5 * (p[IX(i+1, j)] - p[IX(i-1, j)]) / h;
        velV[IX(i, j)] -= 0.5 * (p[IX(i, j+1)] - p[IX(i, j-1)]) / h;
      }
    }
    set_bnd(1, velU); set_bnd(2, velV);
  }

  function vorticityConfinement(dt) {
    const eps = 6.3;
    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        const dudy = (u[IX(i, j+1)] - u[IX(i, j-1)]) * 0.5;
        const dvdx = (v[IX(i+1, j)] - v[IX(i-1, j)]) * 0.5;
        curlField[IX(i, j)] = dvdx - dudy;
      }
    }
    for (let j = 2; j < M; j++) {
      for (let i = 2; i < N; i++) {
        if (obstacle[IX(i, j)]) continue;
        let nx = (Math.abs(curlField[IX(i+1, j)]) - Math.abs(curlField[IX(i-1, j)])) * 0.5;
        let ny = (Math.abs(curlField[IX(i, j+1)]) - Math.abs(curlField[IX(i, j-1)])) * 0.5;
        const len = Math.sqrt(nx*nx + ny*ny) + 1e-5;
        nx /= len; ny /= len;
        const curl = curlField[IX(i, j)];
        u[IX(i, j)] += eps * dt * ( ny * curl);
        v[IX(i, j)] += eps * dt * (-nx * curl);
      }
    }
  }

  function fluidStep(dt) {
    [u0, u] = [u, u0]; [v0, v] = [v, v0];
    if (params.visc > 0) {
      diffuse(1, u, u0, params.visc, dt, 4);
      diffuse(2, v, v0, params.visc, dt, 4);
      project(u, v, u0, v0, 10);
    }
    [u0, u] = [u, u0]; [v0, v] = [v, v0];
    advect(1, u, u0, u0, v0, dt);
    advect(2, v, v0, u0, v0, dt);
    project(u, v, u0, v0, 14);
    
    obstacleBounceSplash();
    project(u, v, u0, v0, 6);
    
    vorticityConfinement(dt);

    [dens0, dens] = [dens, dens0];
    if (params.diff > 0) diffuse(0, dens, dens0, params.diff, dt, 4);
    [dens0, dens] = [dens, dens0];
    advect(0, dens, dens0, u, v, dt);

    for (let k = 0; k < size; k++) {
      dens[k] *= 0.9985;
      u[k] *= 0.9995;
      v[k] *= 0.9995;
    }
  }

  // ===== 通用：获取物体旋转后的轴对齐包围盒 =====
  function getWorldAABB(o) {
    const cx = o.x + o.w / 2;
    const cy = o.y + o.h / 2;
    const angle = (o.angle || 0) % 360;
    if (angle === 0 || angle === 180) {
      return { x: o.x, y: o.y, w: o.w, h: o.h, cx: cx, cy: cy };
    } else {
      const worldW = o.h;
      const worldH = o.w;
      return {
        x: cx - worldW / 2,
        y: cy - worldH / 2,
        w: worldW,
        h: worldH,
        cx: cx,
        cy: cy
      };
    }
  }

  /* ===== 障碍物栅格化：与渲染严格对齐 ===== */
  function rasterizeObstacles() {
    obstacle.fill(0);
    for (const o of objects) {
      if (o.type !== 'wall') continue;
      const shape = o.shape || 'rect';
      const angle = (o.angle || 0) % 360;

      if (shape === 'rect') {
        const rect = getWorldAABB(o);
        const gx0 = clampi(Math.ceil(rect.x * N) + 1, 1, N);
        const gy0 = clampi(Math.ceil(rect.y * M) + 1, 1, M);
        const gx1 = clampi(Math.floor((rect.x + rect.w) * N), 1, N);
        const gy1 = clampi(Math.floor((rect.y + rect.h) * M), 1, M);
        if (gx0 > gx1 || gy0 > gy1) continue;
        for (let j = gy0; j <= gy1; j++) {
          for (let i = gx0; i <= gx1; i++) {
            obstacle[IX(i, j)] = 1;
          }
        }
      } else if (shape === 'circle') {
        const aabb = getWorldAABB(o);
        const cx = (aabb.x + aabb.w/2) * N + 1;
        const cy = (aabb.y + aabb.h/2) * M + 1;
        const rx = Math.max(0.5, (aabb.w/2) * N);
        const ry = Math.max(0.5, (aabb.h/2) * M);
        const gx0 = clampi(Math.floor(aabb.x * N) + 1, 1, N);
        const gy0 = clampi(Math.floor(aabb.y * M) + 1, 1, M);
        const gx1 = clampi(Math.ceil((aabb.x + aabb.w) * N), 1, N);
        const gy1 = clampi(Math.ceil((aabb.y + aabb.h) * M), 1, M);
        for (let j = gy0; j <= gy1; j++) {
          const dy = (j - cy) / ry;
          const dy2 = dy * dy;
          if (dy2 > 1) continue;
          const dxMax = Math.sqrt(1 - dy2);
          const rowLeft = Math.ceil(cx - dxMax * rx);
          const rowRight = Math.floor(cx + dxMax * rx);
          const clampedLeft = clampi(rowLeft, gx0, gx1);
          const clampedRight = clampi(rowRight, gx0, gx1);
          if (clampedLeft > clampedRight) continue;
          for (let i = clampedLeft; i <= clampedRight; i++) {
            obstacle[IX(i, j)] = 1;
          }
        }
      } else if (shape === 'triangle') {
        const aabb = getWorldAABB(o);
        const left = aabb.x * N + 1;
        const right = (aabb.x + aabb.w) * N + 1;
        const top = aabb.y * M + 1;
        const bottom = (aabb.y + aabb.h) * M + 1;
        const cx = (left + right) / 2;
        const cy = (top + bottom) / 2;
        const gx0 = clampi(Math.floor(left), 1, N);
        const gy0 = clampi(Math.floor(top), 1, M);
        const gx1 = clampi(Math.ceil(right), 1, N);
        const gy1 = clampi(Math.ceil(bottom), 1, M);
        const height = Math.max(1, bottom - top);
        const width = Math.max(1, right - left);

        if (angle === 0) {
          for (let j = gy0; j <= gy1; j++) {
            const t = clampi((j - top) / height, 0, 1);
            const halfW = t * (right - left) / 2;
            const rowLeft = Math.ceil(cx - halfW);
            const rowRight = Math.floor(cx + halfW);
            const clampedLeft = clampi(rowLeft, gx0, gx1);
            const clampedRight = clampi(rowRight, gx0, gx1);
            if (clampedLeft > clampedRight) continue;
            for (let i = clampedLeft; i <= clampedRight; i++) obstacle[IX(i, j)] = 1;
          }
        } else if (angle === 90) {
          for (let i = gx0; i <= gx1; i++) {
            const t = clampi((right - i) / width, 0, 1);
            const halfH = t * (bottom - top) / 2;
            const colTop = Math.ceil(cy - halfH);
            const colBottom = Math.floor(cy + halfH);
            const clampedTop = clampi(colTop, gy0, gy1);
            const clampedBottom = clampi(colBottom, gy0, gy1);
            if (clampedTop > clampedBottom) continue;
            for (let j = clampedTop; j <= clampedBottom; j++) obstacle[IX(i, j)] = 1;
          }
        } else if (angle === 180) {
          for (let j = gy0; j <= gy1; j++) {
            const t = clampi((bottom - j) / height, 0, 1);
            const halfW = t * (right - left) / 2;
            const rowLeft = Math.ceil(cx - halfW);
            const rowRight = Math.floor(cx + halfW);
            const clampedLeft = clampi(rowLeft, gx0, gx1);
            const clampedRight = clampi(rowRight, gx0, gx1);
            if (clampedLeft > clampedRight) continue;
            for (let i = clampedLeft; i <= clampedRight; i++) obstacle[IX(i, j)] = 1;
          }
        } else if (angle === 270) {
          for (let i = gx0; i <= gx1; i++) {
            const t = clampi((i - left) / width, 0, 1);
            const halfH = t * (bottom - top) / 2;
            const colTop = Math.ceil(cy - halfH);
            const colBottom = Math.floor(cy + halfH);
            const clampedTop = clampi(colTop, gy0, gy1);
            const clampedBottom = clampi(colBottom, gy0, gy1);
            if (clampedTop > clampedBottom) continue;
            for (let j = clampedTop; j <= clampedBottom; j++) obstacle[IX(i, j)] = 1;
          }
        }
      }
    }
  }

  // ===== 修复：鼓风机出风宽度匹配旋转后尺寸 =====
  function injectBlowers(dt) {
    for (const o of objects) {
      if (o.type !== 'blower') continue;
      const aabb = getWorldAABB(o);
      const cx = aabb.cx * N + 1;
      const cy = aabb.cy * M + 1;
      const sizeCellsX = Math.max(2, Math.round(aabb.w * N));
      const sizeCellsY = Math.max(2, Math.round(aabb.h * M));

      let dirX = 0, dirY = 0;
      if (o.angle === 0)   dirX = 1;
      if (o.angle === 90)  dirY = 1;
      if (o.angle === 180) dirX = -1;
      if (o.angle === 270) dirY = -1;

      const span = Math.max(2, Math.round((dirX !== 0 ? sizeCellsY : sizeCellsX)));
      const forceFactor = 0.5;
      const densityFactor = 0.55;

      for (let s = 0; s < span; s++) {
        let gx, gy;
        if (dirX !== 0) {
          gx = cx + dirX * (sizeCellsX / 2);
          gy = cy - span/2 + s;
        } else {
          gx = cx - span/2 + s;
          gy = cy + dirY * (sizeCellsY / 2);
        }
        gx = clampi(Math.round(gx), 1, N);
        gy = clampi(Math.round(gy), 1, M);
        if (obstacle[IX(gx, gy)]) continue;
        const idx = IX(gx, gy);
        u[idx] += dirX * params.force * forceFactor;
        v[idx] += dirY * params.force * forceFactor;
        dens[idx] = Math.min(1, dens[idx] + 3.2 * dt * 10 * densityFactor);
      }
    }
  }

  /* 流线粒子 */
  const PARTICLE_COUNT = 300;
  let particles = [];
  function initParticles() {
    particles = [];
    for (let k = 0; k < PARTICLE_COUNT; k++) {
      particles.push({
        x: Math.random() * N + 1,
        y: Math.random() * M + 1,
        life: Math.random() * 60
      });
    }
  }
  initParticles();

  function sampleVel(gx, gy) {
    const i = clampi(Math.floor(gx), 1, N), j = clampi(Math.floor(gy), 1, M);
    return [u[IX(i, j)], v[IX(i, j)]];
  }

  function stepParticles(dt) {
    const SPEED_SCALE = 1.6;
    for (const p of particles) {
      const [vu, vv] = sampleVel(p.x, p.y);
      p.x += vu * dt * N * SPEED_SCALE;
      p.y += vv * dt * M * SPEED_SCALE;
      p.life -= 1;
      const gi = clampi(Math.floor(p.x), 1, N), gj = clampi(Math.floor(p.y), 1, M);
      if (p.life <= 0 || p.x < 1 || p.x > N || p.y < 1 || p.y > M || obstacle[IX(gi, gj)]) {
        p.x = 1 + Math.random() * 3;
        p.y = 1 + Math.random() * (M - 2);
        p.life = 90 + Math.random() * 90;
      }
    }
  }

  /* ===== 渲染 ===== */
  let fluidImgData = null;

  function buildBrickPattern() {
    const px = 6;
    const patCanvas = document.createElement('canvas');
    patCanvas.width = px * 2;
    patCanvas.height = px * 2;
    const pctx = patCanvas.getContext('2d');
    disableSmoothing(pctx);

    pctx.fillStyle = '#7c8494';
    pctx.fillRect(0, 0, px*2, px);
    pctx.fillStyle = '#5c6373';
    pctx.fillRect(px, 0, px, px-1);
    pctx.fillStyle = '#5c6373';
    pctx.fillRect(0, px, px*2, px);
    pctx.fillStyle = '#7c8494';
    pctx.fillRect(px, px, px, px-1);

    brickPattern = mctx.createPattern(patCanvas, 'repeat');
  }

  function renderGridToCache() {
    gridCache.width = Math.round(W);
    gridCache.height = Math.round(H);
    gridCtx.fillStyle = '#dfe3ea';
    gridCtx.fillRect(0, 0, W, H);
    const cell = 18;
    gridCtx.strokeStyle = '#c9cfdb';
    gridCtx.lineWidth = 1;
    gridCtx.beginPath();
    for (let x = 0; x <= W; x += cell) { gridCtx.moveTo(x+0.5, 0); gridCtx.lineTo(x+0.5, H); }
    for (let y = 0; y <= H; y += cell) { gridCtx.moveTo(0, y+0.5); gridCtx.lineTo(W, y+0.5); }
    gridCtx.stroke();
  }

  function resizeCanvases() {
    W = stage.clientWidth; H = stage.clientHeight;
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    mainCanvas.width = Math.round(W * dpr);
    mainCanvas.height = Math.round(H * dpr);
    mainCanvas.style.width = W + 'px';
    mainCanvas.style.height = H + 'px';
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    disableSmoothing(mctx);

    SIM_M = clampi(Math.round(SIM_N * (H / Math.max(1, W))), 80, 200);
    allocateFields();
    initParticles();

    fluidCanvas.width = N;
    fluidCanvas.height = M;
    disableSmoothing(fctx);
    fluidImgData = fctx.createImageData(N, M);

    renderGridToCache();
    buildBrickPattern();
  }

  function drawGridBackground() {
    mctx.drawImage(gridCache, 0, 0);
  }

  function renderFluidDensity() {
    const data = fluidImgData.data;
    for (let j = 1; j <= M; j++) {
      for (let i = 1; i <= N; i++) {
        const idx = IX(i, j);
        const dpix = ((j-1) * N + (i-1)) * 4;
        if (obstacle[idx]) {
          data[dpix] = 0; data[dpix+1] = 0; data[dpix+2] = 0; data[dpix+3] = 0;
          continue;
        }
        const d = Math.min(1, dens[idx]);
        const speed = Math.min(1, Math.hypot(u[idx], v[idx]) * 3);
        const r = 20 + 60 * d + 190 * speed;
        const g = 110 + 90 * d + 110 * speed;
        const b = 210 + 45 * d;
        data[dpix]   = clampi(r, 0, 255);
        data[dpix+1] = clampi(g, 0, 255);
        data[dpix+2] = clampi(b, 0, 255);
        data[dpix+3] = clampi(Math.round(60 + 255 * Math.pow(d, 0.55)), 0, 255);
      }
    }
    fctx.putImageData(fluidImgData, 0, 0);
    disableSmoothing(mctx);
    mctx.drawImage(fluidCanvas, 0, 0, N, M, 0, 0, W, H);
  }

  function renderParticles() {
    mctx.fillStyle = 'rgba(30,40,60,0.55)';
    for (const p of particles) {
      const px = (p.x / N) * W, py = (p.y / M) * H;
      mctx.fillRect(px-1, py-1, 2, 2);
    }
  }

  function fracToPx(o) { return { x: o.x * W, y: o.y * H, w: o.w * W, h: o.h * H }; }

  /* ===== 像素化墙体渲染：与栅格严格对齐，消除缝隙 ===== */
  function drawWallSprite(o) {
    const shape = o.shape || 'rect';
    const cellW = W / N;
    const cellH = H / M;
    const aabb = getWorldAABB(o);

    if (shape === 'rect') {
      const gx0 = clampi(Math.ceil(aabb.x * N) + 1, 1, N);
      const gy0 = clampi(Math.ceil(aabb.y * M) + 1, 1, M);
      const gx1 = clampi(Math.floor((aabb.x + aabb.w) * N), 1, N);
      const gy1 = clampi(Math.floor((aabb.y + aabb.h) * M), 1, M);
      if (gx0 > gx1 || gy0 > gy1) return;

      for (let j = gy0; j <= gy1; j++) {
        const sx = (gx0 - 1) * cellW;
        const sy = (j - 1) * cellH;
        const sw = (gx1 - gx0 + 1) * cellW;
        const sh = cellH;
        mctx.fillStyle = '#6b7280';
        mctx.fillRect(sx, sy, sw, sh);
        if (brickPattern) {
          mctx.fillStyle = brickPattern;
          mctx.fillRect(sx, sy, sw, sh);
        }
      }
    } else if (shape === 'circle') {
      const cx = (aabb.x + aabb.w/2) * N + 1;
      const cy = (aabb.y + aabb.h/2) * M + 1;
      const rx = Math.max(0.5, (aabb.w/2) * N);
      const ry = Math.max(0.5, (aabb.h/2) * M);
      const gx0 = clampi(Math.floor(aabb.x * N) + 1, 1, N);
      const gy0 = clampi(Math.floor(aabb.y * M) + 1, 1, M);
      const gx1 = clampi(Math.ceil((aabb.x + aabb.w) * N), 1, N);
      const gy1 = clampi(Math.ceil((aabb.y + aabb.h) * M), 1, M);

      for (let j = gy0; j <= gy1; j++) {
        const dy = (j - cy) / ry;
        const dy2 = dy * dy;
        if (dy2 > 1) continue;
        const dxMax = Math.sqrt(1 - dy2);
        const rowLeft = Math.ceil(cx - dxMax * rx);
        const rowRight = Math.floor(cx + dxMax * rx);
        const clampedLeft = clampi(rowLeft, gx0, gx1);
        const clampedRight = clampi(rowRight, gx0, gx1);
        if (clampedLeft > clampedRight) continue;

        const sx = (clampedLeft - 1) * cellW;
        const sy = (j - 1) * cellH;
        const sw = (clampedRight - clampedLeft + 1) * cellW;
        const sh = cellH;

        mctx.fillStyle = '#6b7280';
        mctx.fillRect(sx, sy, sw, sh);
        if (brickPattern) {
          mctx.fillStyle = brickPattern;
          mctx.fillRect(sx, sy, sw, sh);
        }
      }
    } else if (shape === 'triangle') {
      const angle = (o.angle || 0) % 360;
      const left = aabb.x * N + 1;
      const right = (aabb.x + aabb.w) * N + 1;
      const top = aabb.y * M + 1;
      const bottom = (aabb.y + aabb.h) * M + 1;
      const cx = (left + right) / 2;
      const cy = (top + bottom) / 2;
      const gx0 = clampi(Math.floor(left), 1, N);
      const gy0 = clampi(Math.floor(top), 1, M);
      const gx1 = clampi(Math.ceil(right), 1, N);
      const gy1 = clampi(Math.ceil(bottom), 1, M);
      const height = Math.max(1, bottom - top);
      const width = Math.max(1, right - left);

      let rows = [];
      if (angle === 0) {
        for (let j = gy0; j <= gy1; j++) {
          const t = clampi((j - top) / height, 0, 1);
          const halfW = t * (right - left) / 2;
          rows.push({ j, left: Math.ceil(cx - halfW), right: Math.floor(cx + halfW) });
        }
      } else if (angle === 90) {
        for (let i = gx0; i <= gx1; i++) {
          const t = clampi((right - i) / width, 0, 1);
          const halfH = t * (bottom - top) / 2;
          rows.push({ j: i, left: Math.ceil(cy - halfH), right: Math.floor(cy + halfH) });
        }
      } else if (angle === 180) {
        for (let j = gy0; j <= gy1; j++) {
          const t = clampi((bottom - j) / height, 0, 1);
          const halfW = t * (right - left) / 2;
          rows.push({ j, left: Math.ceil(cx - halfW), right: Math.floor(cx + halfW) });
        }
      } else if (angle === 270) {
        for (let i = gx0; i <= gx1; i++) {
          const t = clampi((i - left) / width, 0, 1);
          const halfH = t * (bottom - top) / 2;
          rows.push({ j: i, left: Math.ceil(cy - halfH), right: Math.floor(cy + halfH) });
        }
      }

      for (const row of rows) {
        const clampedLeft = clampi(row.left, gx0, gx1);
        const clampedRight = clampi(row.right, gx0, gx1);
        if (clampedLeft > clampedRight) continue;
        const sx = (clampedLeft - 1) * cellW;
        const sy = (row.j - 1) * cellH;
        const sw = (clampedRight - clampedLeft + 1) * cellW;
        const sh = cellH;
        mctx.fillStyle = '#6b7280';
        mctx.fillRect(sx, sy, sw, sh);
        if (brickPattern) {
          mctx.fillStyle = brickPattern;
          mctx.fillRect(sx, sy, sw, sh);
        }
      }
    }

    // 选中状态：世界包围盒 + 放大缩放手柄
    if (o.id === selectedId) {
      const r = { x: aabb.x * W, y: aabb.y * H, w: aabb.w * W, h: aabb.h * H };
      mctx.strokeStyle = '#5ad1d6';
      mctx.lineWidth = 2;
      mctx.strokeRect(r.x, r.y, r.w, r.h);
      mctx.fillStyle = '#5ad1d6';
      mctx.fillRect(r.x + r.w - 10, r.y + r.h - 10, 16, 16);
    }
  }

  function drawBlowerSprite(o) {
    const r = fracToPx(o);
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    mctx.save();
    mctx.translate(cx, cy);
    mctx.rotate(o.angle * Math.PI / 180);
    mctx.fillStyle = '#3d4a63';
    mctx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
    mctx.fillStyle = '#4f5f80';
    mctx.fillRect(-r.w/2+3, -r.h/2+3, r.w-6, r.h-6);
    mctx.fillStyle = '#f2a65a';
    const bw = Math.max(2, r.w * 0.08);
    mctx.fillRect(-bw/2, -r.h/2+6, bw, r.h-12);
    mctx.fillRect(-r.w/2+6, -bw/2, r.w-12, bw);
    mctx.fillStyle = '#fff';
    mctx.beginPath();
    mctx.moveTo(r.w/2-2, 0);
    mctx.lineTo(r.w/2-10, -7);
    mctx.lineTo(r.w/2-10, 7);
    mctx.closePath();
    mctx.fill();
    mctx.restore();

    if (o.id === selectedId) {
      const aabb = getWorldAABB(o);
      const r = { x: aabb.x * W, y: aabb.y * H, w: aabb.w * W, h: aabb.h * H };
      mctx.strokeStyle = '#5ad1d6';
      mctx.lineWidth = 2;
      mctx.strokeRect(r.x-2, r.y-2, r.w+4, r.h+4);
      mctx.fillStyle = '#5ad1d6';
      mctx.fillRect(r.x + r.w - 10, r.y + r.h - 10, 16, 16);
    }
  }

  function render() {
    drawGridBackground();
    renderFluidDensity();
    for (const o of objects) {
      if (o.type === 'wall') drawWallSprite(o);
    }
    for (const o of objects) {
      if (o.type === 'blower') drawBlowerSprite(o);
    }
    if (showStreamlines) renderParticles();

    // 拖拽创建预览
    if (drag && drag.mode === 'new-wall') {
      const x = Math.min(drag.curX, drag.startX), y = Math.min(drag.curY, drag.startY);
      const w = Math.abs(drag.curX - drag.startX), h = Math.abs(drag.curY - drag.startY);
      const px = x * W, py = y * H, pw = w * W, ph = h * H;

      mctx.strokeStyle = '#f2a65a';
      mctx.setLineDash([5,4]);
      mctx.lineWidth = 2;
      mctx.strokeRect(px, py, pw, ph);
      mctx.setLineDash([]);
    }
  }

  /* 主循环 */
  let lastT = performance.now();
  function loop(t) {
    try {
      const dt = Math.min(0.033, (t - lastT) / 1000) || 0.016;
      lastT = t;

      fpsFrames++;
      if (t - fpsLastTime >= 1000) {
        fps = fpsFrames;
        fpsFrames = 0;
        fpsLastTime = t;
        if (fpsValLabel) fpsValLabel.textContent = fps;
      }

      if (!paused) {
        rasterizeObstacles();
        injectBlowers(dt);
        fluidStep(0.12);
        if (showStreamlines) stepParticles(0.12);
      }
      render();
    } catch (e) {
      const log = document.getElementById('errorLog');
      if (log) {
        log.style.display = 'block';
        log.textContent = '运行时错误: ' + e.message;
      }
    }
    requestAnimationFrame(loop);
  }

  /* UI 图标绘制 */
  function drawIcon(canvas, kind) {
    const ctx = canvas.getContext('2d');
    disableSmoothing(ctx);
    ctx.clearRect(0, 0, 16, 16);
    if (kind === 'select') {
      ctx.fillStyle = '#eef1f7';
      ctx.beginPath();
      ctx.moveTo(3,2); ctx.lineTo(13,9); ctx.lineTo(9,10); ctx.lineTo(11,14); ctx.lineTo(9,15); ctx.lineTo(7,11); ctx.lineTo(3,13);
      ctx.closePath(); ctx.fill();
    } else if (kind === 'wall') {
      ctx.fillStyle = '#9aa2b3';
      ctx.fillRect(1,3,7,4); ctx.fillRect(9,3,6,4);
      ctx.fillRect(1,8,4,4); ctx.fillRect(6,8,9,4);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(1,3,14,9);
    } else if (kind === 'wall-tri') {
      ctx.fillStyle = '#9aa2b3';
      ctx.beginPath();
      ctx.moveTo(8, 2);
      ctx.lineTo(14, 13);
      ctx.lineTo(2, 13);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.stroke();
    } else if (kind === 'wall-circle') {
      ctx.fillStyle = '#9aa2b3';
      ctx.beginPath();
      ctx.arc(8, 8, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.stroke();
    } else if (kind === 'blower') {
      ctx.fillStyle = '#5ad1d6';
      ctx.fillRect(2,2,12,12);
      ctx.fillStyle = '#2b3142';
      ctx.fillRect(4,4,8,8);
      ctx.fillStyle = '#f2a65a';
      ctx.fillRect(7,3,2,10); ctx.fillRect(3,7,10,2);
    } else if (kind === 'delete') {
      ctx.strokeStyle = '#e8637a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(3,3); ctx.lineTo(13,13); ctx.moveTo(13,3); ctx.lineTo(3,13); ctx.stroke();
    }
  }
  document.querySelectorAll('button.tool canvas').forEach(c => drawIcon(c, c.dataset.icon));

  const toolButtons = document.querySelectorAll('button.tool');
  const toolNameLabel = document.getElementById('toolName');
  function setTool(t) {
    currentTool = t;
    selectedId = null;
    toolButtons.forEach(b => b.classList.toggle('active', b.dataset.tool === t));
    toolNameLabel.textContent = {
      select:'选择',
      wall:'矩形墙',
      'wall-tri':'三角墙',
      'wall-circle':'圆形墙',
      blower:'鼓风机',
      delete:'删除'
    }[t];
  }
  toolButtons.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  setTool('select');

  document.getElementById('clearBtn').addEventListener('click', () => {
    objects = []; selectedId = null; updateStatus();
  });

  const playPauseBtn = document.getElementById('playPause');
  playPauseBtn.addEventListener('click', () => {
    paused = !paused;
    playPauseBtn.textContent = paused ? '▶' : '⏸';
  });

  document.getElementById('forceSlider').addEventListener('input', e => {
    params.force = parseFloat(e.target.value);
    document.getElementById('forceVal').textContent = params.force.toFixed(1);
  });
  document.getElementById('diffSlider').addEventListener('input', e => {
    params.diff = parseFloat(e.target.value) * 0.0001;
    document.getElementById('diffVal').textContent = params.diff.toFixed(4);
  });
  document.getElementById('viscSlider').addEventListener('input', e => {
    params.visc = parseFloat(e.target.value) * 0.0001;
    document.getElementById('viscVal').textContent = params.visc.toFixed(4);
  });
  document.getElementById('streamToggle').addEventListener('change', e => {
    showStreamlines = e.target.checked;
  });

  const objCountLabel = document.getElementById('objCount');
  function updateStatus() { objCountLabel.textContent = objects.length; }

  /* 交互处理 */
  function toFrac(evt) {
    const rect = mainCanvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) / rect.width,
      y: (evt.clientY - rect.top) / rect.height
    };
  }

  // 修复：点击判定基于旋转后的包围盒
  function hitTest(fx, fy) {
    for (let k = objects.length - 1; k >= 0; k--) {
      const o = objects[k];
      const aabb = getWorldAABB(o);
      if (fx >= aabb.x && fx <= aabb.x + aabb.w && fy >= aabb.y && fy <= aabb.y + aabb.h) return o;
    }
    return null;
  }

  // 修复：缩放手柄判定基于旋转后的包围盒右下角
  function hitResizeHandle(fx, fy, o) {
    if (!o || (o.type !== 'wall' && o.type !== 'blower')) return false;
    const aabb = getWorldAABB(o);
    const hx = (aabb.x + aabb.w) * W, hy = (aabb.y + aabb.h) * H;
    return Math.abs(fx * W - hx) < 24 && Math.abs(fy * H - hy) < 24;
  }

  // 默认尺寸：原基础上翻倍
  const DEFAULT_WALL_W = 0.06, DEFAULT_WALL_H = 0.32;
  const DEFAULT_BLOWER_W = 0.14, DEFAULT_BLOWER_H = 0.14;

  mainCanvas.addEventListener('pointerdown', e => {
    mainCanvas.setPointerCapture(e.pointerId);
    const { x: fx, y: fy } = toFrac(e);
    pointerDownInfo = { fx, fy, time: performance.now(), moved: false };

    // 墙体工具（三种形状）
    if (currentTool === 'wall' || currentTool === 'wall-tri' || currentTool === 'wall-circle') {
      const shape = currentTool === 'wall' ? 'rect' : (currentTool === 'wall-tri' ? 'triangle' : 'circle');
      drag = { mode: 'new-wall', shape: shape, startX: fx, startY: fy, curX: fx, curY: fy };
      return;
    }

    if (currentTool === 'blower') {
      const bx = clampi(fx - DEFAULT_BLOWER_W/2, 0, 1 - DEFAULT_BLOWER_W);
      const by = clampi(fy - DEFAULT_BLOWER_H/2, 0, 1 - DEFAULT_BLOWER_H);
      objects.push({
        id: nextId++, type: 'blower',
        x: bx, y: by,
        w: DEFAULT_BLOWER_W, h: DEFAULT_BLOWER_H, angle: 0
      });
      selectedId = nextId - 1;
      updateStatus();
      return;
    }

    if (currentTool === 'delete') {
      const hit = hitTest(fx, fy);
      if (hit) {
        objects = objects.filter(o => o.id !== hit.id);
        updateStatus();
      }
      return;
    }

    const hit = hitTest(fx, fy);
    if (hit && hitResizeHandle(fx, fy, hit)) {
      drag = { mode: 'resize', id: hit.id, startX: fx, startY: fy, origW: hit.w, origH: hit.h };
      selectedId = hit.id;
      return;
    }
    if (hit) {
      selectedId = hit.id;
      drag = { mode: 'move', id: hit.id, startX: fx, startY: fy, origX: hit.x, origY: hit.y };
      if (e.pointerType === 'touch') {
        longPressTimer = setTimeout(() => {
          objects = objects.filter(o => o.id !== hit.id);
          selectedId = null; drag = null; updateStatus();
        }, 550);
      }
    } else {
      selectedId = null;
    }
  });

  mainCanvas.addEventListener('pointermove', e => {
    const { x: fx, y: fy } = toFrac(e);
    if (pointerDownInfo) {
      if (Math.hypot(fx - pointerDownInfo.fx, fy - pointerDownInfo.fy) > 0.004) pointerDownInfo.moved = true;
    }
    if (longPressTimer && pointerDownInfo && pointerDownInfo.moved) {
      clearTimeout(longPressTimer); longPressTimer = null;
    }
    if (!drag) return;

    if (drag.mode === 'new-wall') {
      drag.curX = clampi(fx, 0, 1); drag.curY = clampi(fy, 0, 1);
    } else if (drag.mode === 'move') {
      const o = objects.find(o => o.id === drag.id);
      if (o) {
        o.x = clampi(drag.origX + (fx - drag.startX), 0, 1 - o.w);
        o.y = clampi(drag.origY + (fy - drag.startY), 0, 1 - o.h);
      }
    } else if (drag.mode === 'resize') {
      const o = objects.find(o => o.id === drag.id);
      if (o) {
        const minSize = o.type === 'blower' ? 0.07 : 0.04;
        const maxSize = o.type === 'blower' ? 0.5 : 1;
        o.w = clampi(drag.origW + (fx - drag.startX), minSize, Math.min(maxSize, 1 - o.x));
        o.h = clampi(drag.origH + (fy - drag.startY), minSize, Math.min(maxSize, 1 - o.y));
      }
    }
  });

  mainCanvas.addEventListener('pointerup', e => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    const { x: fx, y: fy } = toFrac(e);

    if (drag && drag.mode === 'new-wall') {
      const x = Math.min(drag.curX, drag.startX), y = Math.min(drag.curY, drag.startY);
      let w = Math.abs(drag.curX - drag.startX), h = Math.abs(drag.curY - drag.startY);
      if (w < 0.03 && h < 0.03) { w = DEFAULT_WALL_W; h = DEFAULT_WALL_H; }
      objects.push({
        id: nextId++, type: 'wall', shape: drag.shape,
        x: clampi(x, 0, 1-w), y: clampi(y, 0, 1-h), w, h, angle: 0
      });
      selectedId = nextId - 1;
      updateStatus();
    }

    // 双击旋转逻辑
    if (pointerDownInfo && !pointerDownInfo.moved && drag && drag.mode === 'move') {
      const o = objects.find(o => o.id === drag.id);
      if (o && (o.type === 'blower' || o.type === 'wall')) {
        const now = performance.now();
        if (now - lastTapTime < DOUBLE_TAP_DELAY && lastTapId === o.id) {
          o.angle = (o.angle + 90) % 360;
          lastTapTime = 0;
          lastTapId = null;
        } else {
          lastTapTime = now;
          lastTapId = o.id;
        }
      }
    }

    drag = null; pointerDownInfo = null;
  });

  mainCanvas.addEventListener('pointercancel', () => {
    drag = null; pointerDownInfo = null;
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  mainCanvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const { x: fx, y: fy } = toFrac(e);
    const hit = hitTest(fx, fy);
    if (hit) {
      objects = objects.filter(o => o.id !== hit.id);
      selectedId = null;
      updateStatus();
    }
  });

  window.addEventListener('resize', resizeCanvases);
  resizeCanvases();

  // 初始场景
  objects.push({ id: nextId++, type: 'blower', x: 0.05, y: 0.43, w: 0.14, h: 0.14, angle: 0 });
  objects.push({ id: nextId++, type: 'wall', shape: 'rect', x: 0.45, y: 0.34, w: 0.06, h: 0.32, angle: 0 });
  updateStatus();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
